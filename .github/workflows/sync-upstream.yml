name: Sync miao-plugin upstream

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/yoimiya-kokomi/miao-plugin.git
          git fetch upstream master

      - name: Refresh upstream reference branch
        run: |
          git push origin upstream/master:refs/heads/upstream-sync --force

      - name: Merge upstream into working tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/master

      - name: Syntax checks
        run: |
          node --check apps/profile/ProfileArtis.js
          node --check apps/profile.js
          node --check components/common/Render.js
          node --check config/system/cfg_system.js

      - name: Customization unit checks
        run: node --test .github/tests/customization.test.mjs

      - name: Open update pull request
        id: update-pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream-update
          base: master
          delete-branch: false
          title: "同步 miao-plugin 上游更新"
          commit-message: "同步 miao-plugin 上游更新"
          body: |
            此 PR 由工作流自动创建，用于同步 yoimiya-kokomi/miao-plugin 上游更新。

            合并前请重点检查圣遗物列表定制文件，确认数量上限、分页、转发和高数量禁用超分逻辑仍然保留。
            若发生冲突，保持 master 不变，手动解决后再合并。

      - name: Enable automatic merge
        if: steps.update-pr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.update-pr.outputs.pull-request-number }}
          merge-method: squash
